<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Fond dégradé premium -->
    <rect width="512" height="512" rx="120" fill="#0F172A"/>
    
    <!-- Cercle de diffusion (effet pulse) -->
    <circle cx="256" cy="256" r="180" stroke="#EF4444" stroke-width="2" stroke-dasharray="20 20" opacity="0.3">
        <animateTransform attributeName="transform" type="rotate" from="0 256 256" to="360 256 256" dur="20s" repeatCount="indefinite" />
    </circle>

    <!-- Bouclier Principal -->
    <path d="M256 80L100 140V260C100 360 256 440 256 440C256 440 412 360 412 260V140L256 80Z" fill="url(#paint0_linear)" stroke="#EF4444" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- L'éclair d'alerte -->
    <path d="M270 180H220L210 260H260L250 340L320 230H270L280 180Z" fill="white">
        <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite" />
    </path>

    <defs>
        <linearGradient id="paint0_linear" x1="256" y1="80" x2="256" y2="440" gradientUnits="userSpaceOnUse">
            <stop stop-color="#EF4444"/>
            <stop offset="1" stop-color="#991B1B"/>
        </linearGradient>
    </defs>
</svg>